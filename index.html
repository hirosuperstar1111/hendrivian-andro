<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Scooter Game</title>
    <style>
        body {
            margin: 0;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: linear-gradient(to bottom, #0b0b1e, #14143a);
            display: block;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.85);
            transition: opacity 0.3s;
        }

        .btn {
            background: linear-gradient(45deg, #00e5ff, #0088ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 15px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>SPACE SCOOTER</h1>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <!-- Menu Layar Awal / Game Over -->
        <div id="uiOverlay">
            <h2 id="menuTitle" style="font-size: 32px; margin-bottom: 5px;">Mulai Petualangan!</h2>
            <p id="menuSubtitle" style="color: #00e5ff; font-size: 18px; margin: 5px 0;"></p>
            <div id="instructions">
                Kontrol Scooter Anda:<br>
                Press <b>PANAH ATAS / SPASI</b> untuk Terbang Melambung<br>
                Lepaskan untuk Turun (Efek Gravitasi)<br>
                Hindari Meteor & Ambil Bintang Energi!
            </div>
            <button id="startBtn" class="btn">MAINKAN</button>
        </div>
    </div>

    <!-- Menghubungkan ke file script.js terpisah -->
    <script src="script.js"></script>
</body>
</html>
